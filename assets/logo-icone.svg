<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="af-grad-sonic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#F72585" />
      <stop offset="100%" stop-color="#7209B7" />
    </linearGradient>
    <linearGradient id="af-grad-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7209B7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="af-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="af-grad-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5964" />
      <stop offset="100%" stop-color="#F72585" />
    </linearGradient>
    <radialGradient id="af-bg-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1435" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0D0A1C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#080711" stop-opacity="0" />
    </radialGradient>
    <filter id="af-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#af-bg-radial)" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#251F45" stroke-width="2" stroke-dasharray="3 11" opacity="0.7" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="#3E346B" stroke-width="1.5" stroke-dasharray="1 7" opacity="0.5" />

  <path d="M 360 170 A 120 120 0 0 1 360 330" fill="none" stroke="url(#af-grad-cyan)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" filter="url(#af-neon-glow)" />
  <path d="M 390 140 A 160 160 0 0 1 390 360" fill="none" stroke="url(#af-grad-magenta)" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 420 115 A 200 200 0 0 1 420 385" fill="none" stroke="#7209B7" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

  <g transform="translate(10, 0)">
    <path d="M 125 150 C 185 110, 275 140, 315 200 L 275 225 C 245 180, 180 160, 135 185 Z" 
          fill="url(#af-grad-cyan)" filter="url(#af-neon-glow)" />
    <path d="M 125 350 C 185 390, 275 360, 315 300 L 275 275 C 245 320, 180 340, 135 315 Z" 
          fill="url(#af-grad-magenta)" filter="url(#af-neon-glow)" />
    <polygon points="175,190 280,250 175,310" fill="url(#af-grad-sonic)" />
    <path d="M 150 250 L 180 250 L 195 210 L 210 290 L 225 170 L 240 330 L 255 220 L 270 275 L 285 250 L 310 250" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#af-neon-glow)" />
  </g>

  <circle cx="305" cy="250" r="4" fill="#00F5D4" filter="url(#af-neon-glow)" />
  <circle cx="160" cy="250" r="3" fill="#F72585" />
</svg>